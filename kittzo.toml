# Safe defaults only. Integrations are set up in the UI's Settings tab; secrets live in the OS keyring.
server_port = 7878
log_level = "info"

[discord]
reconcile_interval_secs = 300

[payment_schedule]
poll_interval_secs = 10

[outbox]
poll_interval_secs = 1
retry_after_secs = 30
batch_limit = 100

[email]
imap_host = "imap.gmail.com"
label = "kittzo/payments"
poll_interval_secs = 30

[openrouter]
url = "https://openrouter.ai/api/v1/chat/completions"
model = "z-ai/glm-5.3-flash"
pdf_engine = "mistral-ocr"
