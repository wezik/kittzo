<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>kittzo</title>
<style>
  :root {
    --bg: #fdfdfc;
    --text: #111;
    --muted: #8a8a8a;
    --border: #e3e3e0;
    --border-soft: #eeeeec;
    --accent: #1f6f5c;
    --danger: #a3392c;
    --pending: #a5690a;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.5;
  }

  .page {
    max-width: 880px;
    margin: 0 auto;
    padding: 2.5rem 1.5rem 5rem;
  }

  .site-header {
    display: flex;
    align-items: baseline;
    gap: 0.75em;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
    padding-bottom: 1.25em;
    margin-bottom: 2.5em;
  }

  .site-header h1 {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 0;
  }

  .tagline {
    margin: 0;
    font-size: 13px;
    color: var(--muted);
  }

  .panel { margin-bottom: 3em; }

  .panel-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-bottom: 1px solid var(--border-soft);
    padding-bottom: 0.6em;
    margin-bottom: 1.1em;
  }

  .panel-header h2 {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: #333;
    margin: 0;
  }

  .confirmation-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1em;
    flex-wrap: wrap;
    padding: 0.8em 0;
    border-bottom: 1px solid var(--border-soft);
  }

  .confirmation-row:last-child { border-bottom: 0; }

  .cell-title { font-weight: 600; }

  .cell-sub {
    font-size: 12px;
    color: var(--muted);
    margin-top: 0.15em;
  }

  .cell-sub a, td a { color: inherit; }

  .actions {
    display: flex;
    gap: 0.5em;
    flex-shrink: 0;
  }

  .ok { color: var(--accent); }
  .pending { color: var(--pending); font-weight: 600; }
  .muted { color: var(--muted); }

  .empty-state {
    color: var(--muted);
    font-size: 13px;
    font-style: italic;
    padding: 0.5em 0;
    margin: 0;
  }

  .inline-form {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: 1.25em;
    margin-bottom: 1.5em;
  }

  [hidden] { display: none !important; }

  .kind-fields {
    flex-basis: 100%;
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: inherit;
  }

  .inline-form label {
    display: flex;
    flex-direction: column;
    gap: 0.35em;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
  }

  .inline-form input, .inline-form select {
    font-family: inherit;
    font-size: 14px;
    color: var(--text);
    border: 0;
    border-bottom: 1px solid var(--border);
    background: transparent;
    padding: 0.3em 0.1em;
    min-width: 8em;
  }

  .inline-form input:focus, .inline-form select:focus {
    outline: none;
    border-bottom-color: var(--accent);
  }

  button {
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    padding: 0.55em 1em;
    border: 1px solid var(--text);
    border-radius: 0;
    background: transparent;
    color: var(--text);
    cursor: pointer;
  }

  button:hover { background: var(--text); color: #fff; }

  button.primary, .inline-form button[type="submit"] {
    border-color: var(--accent);
    color: var(--accent);
  }
  button.primary:hover, .inline-form button[type="submit"]:hover {
    background: var(--accent);
    color: #fff;
  }

  button.danger {
    border-color: var(--danger);
    color: var(--danger);
  }
  button.danger:hover {
    background: var(--danger);
    color: #fff;
  }

  td button { font-size: 10px; padding: 0.35em 0.7em; margin-left: 0.4em; }
  td.actions button { margin-left: 0; }

  .table-scroll { overflow-x: auto; }

  table { width: 100%; border-collapse: collapse; }

  th {
    text-align: left;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    padding: 0 0.6em 0.6em 0;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  td {
    padding: 0.65em 0.6em 0.65em 0;
    border-bottom: 1px solid var(--border-soft);
    font-size: 13.5px;
    white-space: nowrap;
    vertical-align: top;
  }

  td:first-child { white-space: normal; min-width: 14em; }

  th:first-child, td:first-child { padding-left: 0; }

  td.amount, th.amount { font-variant-numeric: tabular-nums; text-align: right; padding-right: 1.5em; }

  .expandable { cursor: pointer; }
  tr.expandable:hover td, .confirmation-row.expandable:hover { background: #f6f6f4; }
  tr.expandable.open td { border-bottom-color: transparent; }
  td.wrap { white-space: normal; }

  .details {
    flex-basis: 100%;
    display: grid;
    grid-template-columns: max-content 1fr;
    gap: 0.25em 1.5em;
    margin: 0;
    font-size: 12.5px;
    cursor: auto;
  }
  .details dt {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    padding-top: 0.1em;
  }
  .details dd { margin: 0; font-variant-numeric: tabular-nums; white-space: normal; word-break: break-word; }
  .details a { color: inherit; }
  tr.detail-row td { padding: 0.2em 0 1em; }

  @media (max-width: 480px) {
    .page { padding: 1.5rem 1rem 4rem; }
    .inline-form { gap: 0.75em; }
    .inline-form input, .inline-form select { min-width: 6em; }
  }
</style>
</head>
<body>
  <div class="page">
    <header class="site-header">
      <h1>kittzo</h1>
      <p class="tagline">payments &amp; approvals</p>
    </header>

    <section class="panel">
      <div class="panel-header">
        <h2>Awaiting approval</h2>
      </div>
      <div id="confirmations-body"></div>
      <p class="empty-state" id="confirmations-empty" hidden>Nothing waiting on you.</p>
    </section>

    <section class="panel">
      <div class="panel-header">
        <h2>Payments</h2>
      </div>
      <form id="payment-form" class="inline-form">
        <label>Kind<select name="type">
          <option value="standard">Standard</option>
          <option value="tax">Tax</option>
        </select></label>
        <label>Amount<input name="amount" inputmode="decimal" placeholder="19.99" required /></label>
        <label>Currency<input name="currency" placeholder="PLN" value="PLN" required /></label>
        <div class="kind-fields">
          <label data-kind="standard">Title<input name="title" placeholder="ZUS" required /></label>
          <label data-kind="standard">Account number<input name="account_number" placeholder="26 digits" required /></label>
          <label data-kind="standard">Recipient<input name="recipient" placeholder="name and address" required /></label>
          <label data-kind="tax" hidden>Form<select name="form_symbol">
            <option value="VAT-7">VAT-7</option>
            <option value="PPL">PPE</option>
          </select></label>
          <button type="submit">Add</button>
        </div>
      </form>
      <div class="table-scroll">
        <table>
          <thead><tr><th>Title</th><th>Recipient</th><th class="amount">Amount</th><th>Status</th></tr></thead>
          <tbody id="payments-body"></tbody>
        </table>
      </div>
      <p class="empty-state" id="payments-empty" hidden>No payments yet.</p>
    </section>

    <section class="panel">
      <div class="panel-header">
        <h2>Payment schedules</h2>
      </div>
      <form id="schedule-form" class="inline-form">
        <label>Amount<input name="amount" inputmode="decimal" placeholder="19.99" required /></label>
        <label>Currency<input name="currency" placeholder="PLN" value="PLN" required /></label>
        <label>Day of month<input name="day_of_month" type="number" min="1" max="31" placeholder="1" required /></label>
        <div class="kind-fields">
          <label>Title<input name="title_template" placeholder="Czynsz {MM}/{YYYY}" title="{MM} and {YYYY} are filled in from each due date" required /></label>
          <label>Account number<input name="account_number" placeholder="26 digits" required /></label>
          <label>Recipient<input name="recipient" placeholder="name and address" required /></label>
          <button type="submit">Create</button>
        </div>
      </form>
      <div class="table-scroll">
        <table>
          <thead><tr><th>Schedule</th><th class="amount">Amount</th><th>Monthly on</th><th>Next due</th><th></th></tr></thead>
          <tbody id="schedules-body"></tbody>
        </table>
      </div>
      <p class="empty-state" id="schedules-empty" hidden>No schedules yet.</p>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
