<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>kittzo</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.25rem; }
  section { margin-bottom: 2.5rem; }
  form { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem; }
  input { padding: 0.3rem; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 0.3rem 0.6rem; border-bottom: 1px solid #ddd; font-size: 0.9rem; }
  button { padding: 0.3rem 0.8rem; }
</style>
</head>
<body>
  <h1>kittzo</h1>

  <section>
    <h2>Ingest payment</h2>
    <form id="payment-form">
      <input name="amount" placeholder="19.99" required />
      <input name="currency" placeholder="USD" value="USD" required />
      <button type="submit">Ingest</button>
    </form>
    <table>
      <thead><tr><th>Amount</th><th>Source</th><th>Created</th></tr></thead>
      <tbody id="payments-body"></tbody>
    </table>
  </section>

  <section>
    <h2>Payment schedules</h2>
    <form id="schedule-form">
      <input name="amount" placeholder="19.99" required />
      <input name="currency" placeholder="USD" value="USD" required />
      <input name="interval_months" type="number" min="1" placeholder="months" value="1" required />
      <input name="day_of_month" type="number" min="1" max="31" placeholder="day" required />
      <button type="submit">Create</button>
    </form>
    <table>
      <thead><tr><th>Amount</th><th>Recurrence</th><th>Status</th><th>Last run</th></tr></thead>
      <tbody id="schedules-body"></tbody>
    </table>
  </section>

  <script src="app.js"></script>
</body>
</html>
