[package]
name = "kittzo"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
axum = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
rusty-money = { version = "0.5.0", features = ["serde"] }
rust_decimal = "1.43"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "migrate", "time"] }
uuid = { version = "1.26.1", features = ["v4"] }
time = { version = "0.3.55", features = ["serde", "std"] }
async-trait = "0.1.92"

[dev-dependencies]
serde_json = "1"
